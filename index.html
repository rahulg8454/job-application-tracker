<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Page title -->
    <title>Rahul Gupta | Portfolio</title>

    <!-- Basic SEO -->
    <meta
      name="description"
      content="Rahul Gupta's personal developer portfolio showcasing projects, skills, and experience in web development."
    />
    <meta name="author" content="Rahul Gupta" />

    <!-- Open Graph (for LinkedIn, WhatsApp, etc.) -->
    <meta property="og:title" content="Rahul Gupta | Developer Portfolio" />
    <meta
      property="og:description"
      content="Explore Rahul Gupta's projects, skills, and experience in modern web development."
    />
    <meta property="og:type" content="website" />
    <!-- Put your own image URL here (e.g. Vercel/public/og-image.png) -->
    <meta property="og:image" content="https://your-domain.com/og-image.png" />
    <meta property="og:url" content="https://your-domain.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Optional: your own handle or leave blank -->
    <meta name="twitter:site" content="@yourhandle" />
    <meta name="twitter:image" content="https://your-domain.com/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
